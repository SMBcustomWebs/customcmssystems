name: Deploy to Staging

# MANUAL ONLY. Never fires on a push or a merge.
# Actions tab -> "Deploy to Staging" -> Run workflow -> pick a branch.
#
# WHY lftp AND NOT SamKirkland/FTP-Deploy-Action
# That action has no retry. Its 14 inputs (verified against action.yml at the
# v4.3.3 tag) contain no retry, concurrency or throttle control, so a single
# dropped socket fails the whole step and nothing it had already sent is
# recorded. Against HostGator's Pure-FTPd that meant four runs dying at four
# different files with
#   "Server sent FIN packet unexpectedly, closing connection"
# Splitting the tree into sixteen chunks only made each loss smaller; it never
# made the transfer survive a drop. lftp reconnects and carries on, which is
# the actual thing that was missing.
#
# HOW THE PAYLOAD IS BUILT
# Every exclusion happens HERE, in git, before lftp is involved - not in lftp
# glob patterns whose nested-path matching is easy to get subtly wrong. The
# manifest is built from `git ls-files`, so anything gitignored (config.php,
# ccs_dash/uploads, assets/images|logos|videos|media, the 1.1 GB and 63 MB
# files) cannot appear by construction. _deploy/ then holds EXACTLY what goes
# on the server and lftp mirrors it with no --exclude at all.
#
# Expected payload: 1,784 files. The step prints the count and fails if it is
# zero. If that number moves a lot without you adding files, look at the
# manifest filter below before trusting the run.
#
# NEVER add --delete to the mirror command. It would remove everything on the
# server that is not in _deploy/, and ccs_dash/uploads (1.1 GB) exists in no
# repository.
#
# ssl:verify-certificate is off to match what was already happening: the
# action's `security` input defaults to "loose", which is documented as
# "allow connection even when the domain is not certificate". Worth tightening
# once the deploy is green and the FTP password has been rotated.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build deploy payload
        run: |
          set -euo pipefail
          git ls-files \
            | grep -v -E '^(\.github|\.vscode|_tools|_merge_backup|module-display)/' \
            | grep -v -E '^ccs_dash/includes/ckeditor_old/' \
            | grep -v -E '^assets/fontawesome/(svgs|sprites|scss|less|metadata|js)/' \
            | grep -v -E '^snippets/pb_mods/DNU_header/' \
            | grep -v -E '\.md$' \
            | grep -v -E '\.map$' \
            | grep -v -E '^[^/]*\.txt$' \
            > manifest.txt
          COUNT=$(wc -l < manifest.txt)
          echo "payload files: $COUNT"
          test "$COUNT" -gt 0
          mkdir -p _deploy
          tar -cf - -T manifest.txt | tar -xf - -C _deploy
          echo "materialised: $(find _deploy -type f | wc -l)"
          echo "zero-byte files (must be 0): $(find _deploy -type f -empty | wc -l)"
          test "$(find _deploy -type f -empty | wc -l)" -eq 0

      - name: Upload to staging
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD_STAGING }}
        run: |
          lftp --env-password \
               -u "${{ secrets.FTP_USERNAME_STAGING }}" \
               "ftp://${{ secrets.FTP_SERVER }}" \
               -e "
                 set ftp:ssl-force true;
                 set ftp:ssl-protect-data true;
                 set ssl:verify-certificate no;
                 set net:timeout 20;
                 set net:max-retries 15;
                 set net:persist-retries 10;
                 set net:reconnect-interval-base 5;
                 set xfer:clobber on;
                 set cmd:fail-exit yes;
                 mirror -R --verbose=1 --parallel=1 _deploy/ ./ ;
                 bye
               "
