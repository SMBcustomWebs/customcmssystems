name: Deploy to Staging

# FIRES ON EVERY MERGE INTO main, and can also be run by hand from the
# Actions tab -> "Deploy to Staging" -> Run workflow.
#
# Work on a branch, merge it into main. The merge is a push to main, which is
# what triggers this. main is therefore ALWAYS what is on staging - if the two
# ever disagree, main is right and the server is stale, never the other way.
#
# ---------------------------------------------------------------------------
# HOW IT DECIDES WHAT TO SEND
# ---------------------------------------------------------------------------
# The server holds .deploy-state:
#
#     sha=<commit of the last successful deploy>
#     excl=<md5 of the EXCL regex that deploy used>
#
# Each run reads it and asks GIT what changed since that commit. Git compares
# file CONTENT, so nothing depends on timestamps.
#
# Timestamps were the obvious approach and they are a trap here.
# actions/checkout stamps every file with the checkout time, so everything
# always looks new. The fix for that is restoring mtimes from commit dates -
# but then, if the server does not honour SITE UTIME, the remote keeps its
# upload time and a file whose commit is OLDER than the last deploy is silently
# skipped. Merge a branch on Friday that you committed on Monday, after a
# Wednesday deploy, and the change never ships, with no error anywhere.
#
# A FULL RESYNC happens when, and only when:
#   - .deploy-state is missing (first run, or you deleted it to force one)
#   - its sha is not in this repo's history (force-push, rewritten history)
#   - its excl hash differs from this run's, i.e. the EXCLUSION LIST CHANGED
#     and git would not report newly-included files as edits
#   - the state file is in the old bare-sha format with no excl line
#
# Note it keys on the EXCLUSION LIST, not on "deploy.yml changed". Editing a
# comment or a timeout in this file no longer costs a 25-minute full deploy.
# If you change the manifest LOGIC below without changing EXCL, force a resync
# by hand: delete .deploy-state in cPanel File Manager and run the workflow.
#
# ---------------------------------------------------------------------------
# HOW IT SENDS
# ---------------------------------------------------------------------------
# INCREMENTAL uses curl, one file per invocation, with --ftp-create-dirs.
# FULL uses lftp mirror.
#
# They differ because mirror compares a source tree to a target tree, and that
# means enumerating the remote side first. With 1,784 files on the server that
# took 9m30s to deliver ONE changed file - the transfer itself was two log
# lines at the very end. curl just opens a connection and puts the file, so an
# incremental deploy costs seconds. For a full resync the enumeration is
# irrelevant because everything is being sent anyway, and mirror handles the
# whole tree in one session.
#
# mirror also logs "Removing old file" before each transfer - it deletes the
# remote file, then writes the new one. On a live page that is a window where
# the file 404s. curl overwrites in place.
#
# Credentials go to curl on STDIN via -K -, so the password never appears in
# the process list or on disk. lftp uses --env-password for the same reason.
#
# DELETIONS ARE NOT PROPAGATED. A file deleted from the repo stays on the
# server; the run warns and lists them. Nothing here carries --delete and
# nothing should: ccs_dash/uploads is 1.1 GB and exists in no repository.
#
# ---------------------------------------------------------------------------
# WHAT GOES TO THE SERVER
# ---------------------------------------------------------------------------
# Every exclusion is decided HERE, in git, before any FTP tool is involved -
# not in glob patterns whose nested-path matching is easy to get subtly wrong.
# The list comes from `git ls-files`, so anything gitignored (config.php,
# ccs_dash/uploads, assets media) cannot appear by construction. _deploy/ holds
# EXACTLY what is being sent.
#
# A FULL payload is 1,784 files as of 2026-10-21.

on:
  push:
    branches:
      - main
    # A merge touching ONLY these never reaches the server, so it should not
    # spend a deploy. GitHub skips the run only when EVERY changed file matches,
    # so a commit mixing a doc and a template still deploys.
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '_tools/**'
      - '_merge_backup/**'
      - 'module-display/**'
      - '*.txt'
  workflow_dispatch:

# One deploy at a time against one FTP account. cancel-in-progress is false on
# purpose: killing a half-finished upload would leave the server in a mixed
# state. A second merge queues behind the first instead of racing it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FTP_HOST: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USERNAME_STAGING }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD_STAGING }}
      # every exclusion, as ONE regex so no intermediate grep can fail the pipe
      EXCL: '^(\.github|\.vscode|_tools|_merge_backup|module-display)/|^ccs_dash/includes/ckeditor_old/|^assets/fontawesome/(svgs|sprites|scss|less|metadata|js)/|^snippets/pb_mods/DNU_header/|\.md$|\.map$|^[^/]*\.txt$'
      LFTP_SETTINGS: >-
        set ftp:ssl-force true;
        set ftp:ssl-protect-data true;
        set ssl:verify-certificate no;
        set net:timeout 20;
        set net:max-retries 15;
        set net:persist-retries 10;
        set net:reconnect-interval-base 5;
        set xfer:clobber on;
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # git diff needs the previously deployed commit to be present.
          # A shallow clone would not have it and every run would be a full one.
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Read deploy state from the server
        run: |
          # A missing .deploy-state is normal on a first run, so this step must
          # not fail the job. The retry settings in LFTP_SETTINGS are for the
          # upload; here a 550 "not found" is a hard error that persist-retries
          # would sit and retry for 9+ minutes. A later 'set' wins.
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" -e "
            $LFTP_SETTINGS
            set cmd:fail-exit no;
            set net:max-retries 2;
            set net:persist-retries 0;
            get .deploy-state -o state.txt;
            bye
          " || true
          if [ -s state.txt ]; then echo "state file retrieved"; else echo "no .deploy-state on the server"; fi

      - name: Decide what to send
        run: |
          set -euo pipefail
          EXCL_HASH=$(printf '%s' "$EXCL" | md5sum | cut -d' ' -f1)
          LAST=""; LASTEXCL=""; LEGACY=0; MODE=full
          WHY="no .deploy-state on the server"

          if [ -s state.txt ]; then
            if grep -q '^sha=' state.txt; then
              LAST=$(grep '^sha='  state.txt | head -1 | cut -d= -f2- | tr -dc '[:alnum:]')
              LASTEXCL=$(grep '^excl=' state.txt | head -1 | cut -d= -f2- | tr -dc '[:alnum:]')
            else
              # legacy format: the whole file was just the sha, no excl line
              LAST=$(tr -dc '[:alnum:]' < state.txt)
              LEGACY=1
            fi
          fi

          if [ -n "$LAST" ]; then
            if ! git cat-file -e "${LAST}^{commit}" 2>/dev/null; then
              WHY="commit $LAST is not in this history"
            elif [ "$LEGACY" = 1 ]; then
              WHY="state file predates exclusion tracking - resyncing once to record it"
            elif [ "$LASTEXCL" != "$EXCL_HASH" ]; then
              WHY="the exclusion list changed since the last deploy"
            else
              MODE=incremental
            fi
          fi

          if [ "$MODE" = full ]; then
            echo "FULL RESYNC: $WHY"
            git ls-files | grep -v -E "$EXCL" > send.txt || true
          else
            echo "incremental, from $LAST"
            # ACMRT = added/copied/modified/renamed/typechanged. Deletions are
            # excluded deliberately: the file is gone from the tree, so staging
            # it would fail, and nothing here deletes on the server anyway.
            git diff --name-only --diff-filter=ACMRT "$LAST" HEAD | grep -v -E "$EXCL" > send.txt || true
            git diff --name-only --diff-filter=D    "$LAST" HEAD | grep -v -E "$EXCL" > gone.txt || true
            if [ -s gone.txt ]; then
              echo "::warning::deleted from the repo but LEFT ON THE SERVER - remove by hand in cPanel:"
              sed 's/^/  /' gone.txt
            fi
          fi

          COUNT=$(wc -l < send.txt)
          echo "mode=$MODE  files to send=$COUNT"
          # head reads the file directly. Piping sed INTO head makes head exit
          # early, sed die of SIGPIPE, and pipefail kill the whole step.
          head -40 send.txt | sed 's/^/  /'
          [ "$COUNT" -gt 40 ] && echo "  ... and $((COUNT-40)) more" || true
          { echo "MODE=$MODE"; echo "COUNT=$COUNT"; echo "EXCL_HASH=$EXCL_HASH"; } >> "$GITHUB_ENV"

      - name: Build payload
        if: env.COUNT != '0'
        run: |
          set -euo pipefail
          mkdir -p _deploy
          tar -cf - -T send.txt | tar -xf - -C _deploy
          echo "materialised: $(find _deploy -type f | wc -l)"
          # A zero-byte file drops the FTP session on this host. The stubs under
          # snippets/pb_mods carry a cms:ignore note so they are never empty; if
          # this ever trips, FILL the file - do not delete or exclude it.
          EMPTY=$(find _deploy -type f -empty | wc -l)
          echo "zero-byte files (must be 0): $EMPTY"
          test "$EMPTY" -eq 0

      - name: Upload, then record the commit
        if: env.COUNT != '0'
        run: |
          set -euo pipefail
          printf 'sha=%s\nexcl=%s\n' "$(git rev-parse HEAD)" "$EXCL_HASH" > deploy-state.txt

          # credentials on stdin: never in the process list, never on disk
          creds() { printf 'user = "%s:%s"\n' "$FTP_USER" "$LFTP_PASSWORD"; }
          send() {  # send <local> <remote>
            creds | curl -K - --ssl-reqd -k --ftp-create-dirs \
                         --retry 5 --retry-delay 3 --retry-connrefused \
                         --connect-timeout 30 --max-time 300 \
                         --fail --silent --show-error \
                         -T "$1" "ftp://$FTP_HOST/$2"
          }

          if [ "$MODE" = full ]; then
            echo "full resync via lftp mirror - enumeration cost is irrelevant when sending everything"
            lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" -e "
              $LFTP_SETTINGS
              set cmd:fail-exit yes;
              mirror -R --transfer-all --verbose=1 --parallel=1 _deploy/ ./ ;
              bye
            "
          else
            # set -e means the first failure aborts before the state write below
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              send "_deploy/$f" "$f"
              echo "  sent $f"
            done < send.txt
          fi

          # Only reached if every transfer above succeeded, so .deploy-state is
          # never advanced past a failure.
          send deploy-state.txt .deploy-state
          echo "deployed $COUNT file(s) at $(git rev-parse HEAD)"

      - name: Nothing to do
        if: env.COUNT == '0'
        run: echo "No deployable file changed - server is already current."
