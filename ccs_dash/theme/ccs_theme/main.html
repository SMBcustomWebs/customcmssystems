    <style>
        <cms:admin_css />
        
        /* DECLARE ALL CSS VARIABLES FOR STYLES.CSS */
        :root {
            --admin-primary: <cms:show primary />;
            --admin-secondary: <cms:show secondary />;
            --admin-tertiary: <cms:show tertiary />;
            --admin-quaternary: <cms:show quaternary />;
            --admin-success: <cms:show success />;
            --admin-info: <cms:show info />;
            --admin-warning: <cms:show warning />;
            --admin-danger: <cms:show danger />;
            --admin-light: <cms:show light />;
            --admin-dark: <cms:show dark />;
            --admin-white: <cms:show white />;
            --admin-black: <cms:show black />;
            --admin-bg: <cms:show body_bg />;
            --admin-text: <cms:show body_clr />;
        }		
		
		
        /* 1. Neutral Workspace Background */
        body, #simple-page, #tabs-page #content { 
            background-color: #f4f6f8 !important; 
            color: #333333 !important; 
        }
        #header, #tabs-page .ctrl-bot { 
            background-color: #ffffff !important; 
        }

        /* 2. Theme-Driven Sidebar Background */
        #sidebar, #sidebar-btns, #menu-wrap, .sidebar-txt, #sidebar-bot, #sidebar-top { 
            background-color: <cms:show body_bg /> !important; 
            border-color: rgba(128, 128, 128, 0.1) !important;
            text-shadow: none !important;
            box-shadow: none !important;
        }

        /* 3. Theme-Driven Sidebar Text (Automatic Contrast) */
        .sidebar-txt > p, .sidebar-txt > p > a, #sidebar-btns > .btn, 
        #nav>li>a, .nav-group>ul>li>a {
            color: <cms:show body_clr /> !important;
            text-shadow: none !important;
        }
        .nav-icon > .i, #sidebar-toggle > .i { 
            fill: <cms:show body_clr /> !important; 
            opacity: 0.8;
        }

        /* 4. Group Headers -> TERTIARY Color */
        .nav-heading-toggle {
            color: <cms:show tertiary /> !important;
            opacity: 0.9;
            text-shadow: none !important;
        }

        /* 5. Hover States */
        #nav>li>a:hover, #nav>li>a:focus, .nav-group>ul>li>a:hover, .nav-group>ul>li>a:focus { 
            background-color: rgba(128, 128, 128, 0.1) !important; 
            color: <cms:show primary /> !important; 
        }
        .nav-icon:hover > .i, .nav-icon:focus > .i { fill: <cms:show primary /> !important; opacity: 1; }

        /* 6. Active Sidebar Items -> SECONDARY Color */
        #nav>li>.nav-active, #nav>li>.nav-active:hover, #nav>li>.nav-active:focus,
        .nav-group>ul>li>.nav-active, .nav-group>ul>li>.nav-active:hover, .nav-group>ul>li>.nav-active:focus {
            background-color: <cms:show secondary /> !important;
            color: #ffffff !important;
            border-color: <cms:show secondary /> !important;
        }
        .nav-active.nav-icon > .i { fill: #ffffff !important; opacity: 1; }

        /* 7. Buttons & Form Elements -> PRIMARY Color */
        .btn.btn-primary, .btn-menu.toggled, .table.table-primary>thead,
        .ctrl>input:checked+span.ctrl-option, .ctrl>input:active+span.ctrl-option,
        .ctrls-checkbox>label>input:checked+span.ctrl-option, .ctrls-radio>label>input:checked+span.ctrl-option,
        .checklist>li>label>input:checked+span.ctrl-option,
        .panel-heading.panel-primary {
            background-color: <cms:show primary /> !important;
            border-color: <cms:show primary /> !important;
            color: #ffffff !important;
        }

        .select>select:focus+.select-caret>.i, .prepend>.text:focus~.i, .prepend>.password:focus~.i { 
            fill: <cms:show primary /> !important; 
        }
        button.btn-txt:hover, button.btn-txt:focus { 
            color: <cms:show primary /> !important; 
            fill: <cms:show primary /> !important; 
        }

        /* 8. Button Hover States -> SECONDARY Color */
        .btn.btn-primary:focus, .btn.btn-primary:active, .btn.btn-primary:hover { 
            background-color: <cms:show secondary /> !important; 
            border-color: <cms:show secondary /> !important; 
        }

        /* 9. Badges & Counters -> QUATERNARY Color */
        .nav-count {
            background-color: <cms:show quaternary /> !important;
            border-color: <cms:show quaternary /> !important;
            color: #111111 !important; /* Kept dark for contrast against light quaternary */
        }

        /* 10. Highlights & Borders */
        .panel-heading.panel-primary, .panel-heading.panel-primary+.panel-body,
        .table.table-primary, .table.table-primary>thead>tr>th { 
            border-color: <cms:show primary /> !important; 
        }
        input[type="text"]:focus, input[type="password"]:focus,
        textarea:focus, select:focus, .nicEdit-mainContain.nicEdit-mainSelected { 
            border-color: <cms:show primary /> !important; 
            box-shadow: 0 0 4px <cms:show primary /> !important; 
        }
        ::-moz-selection { background: <cms:show primary /> !important; color: #fff; }
        ::selection { background: <cms:show primary /> !important; color: #fff; }

    </style>
