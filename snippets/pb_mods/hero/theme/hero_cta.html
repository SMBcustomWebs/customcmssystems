<cms:if ccs_hro_cta_opt ge '1'>
    
    <div class="d-flex flex-wrap w-100 <cms:show ccs_hro_cta_grp_dir /> gap-<cms:show ccs_hro_cta_grp_gap /> justify-content-<cms:show ccs_hro_cta_grp_halg /> align-items-<cms:show ccs_hro_cta_grp_halg /> mt-4">

        <cms:set btn_1_tgt="<cms:if ccs_hro_cta_1_lnk='custom'>target='_blank'</cms:if>" />
        <cms:set btn_1_url="<cms:if ccs_hro_cta_1_lnk='custom'><cms:show ccs_hro_cta_1_cst_lnk /><cms:else /><cms:show ccs_hro_cta_1_lnk /></cms:if>" />
        
        <a href="<cms:show btn_1_url />" class="<cms:show btn_1_cls />" <cms:show btn_1_tgt />>
            <cms:if ccs_hro_cta_1_clr != 'link' && ccs_hro_cta_1_icon_pos='left'>
                <i class="<cms:show ccs_hro_cta_1_icon_fa /> me-2" aria-hidden="true"></i>
            </cms:if>
            <cms:show ccs_hro_cta_1_txt />
            <cms:if ccs_hro_cta_1_clr != 'link' && ccs_hro_cta_1_icon_pos='right'>
                <i class="<cms:show ccs_hro_cta_1_icon_fa /> ms-2" aria-hidden="true"></i>
            </cms:if>
            <cms:if ccs_hro_cta_1_lnk='custom'>
                <i class="fa-solid fa-arrow-up-right-from-square ms-2 opacity-75" style="font-size: 0.85em;" aria-hidden="true"></i>
                <span class="visually-hidden">(opens in a new tab)</span>
            </cms:if>
        </a>

        <cms:if ccs_hro_cta_opt ge '2'>
            <cms:set btn_2_tgt="<cms:if ccs_hro_cta_2_lnk='custom'>target='_blank'</cms:if>" />

                    <i class="fa-solid fa-arrow-up-right-from-square ms-2 opacity-75" style="font-size: 0.85em;" aria-hidden="true"></i>
                    <span class="visually-hidden">(opens in a new tab)</span>
                </cms:if>
            </a>

                <cms:if ccs_hro_cta_3_lnk='custom'>
