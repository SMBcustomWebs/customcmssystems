<cms:embed 'pb_mods/hero/theme/hero_custom_settings.html' />

<section id="<cms:show local_hero_id />" class="p-0 has-parallax position-relative overflow-hidden">
    
    <div class="bg-holder hro-base"></div>
    
    <cms:if ccs_hro_bg_img>
        <div class="bg-holder" 
             style="background-image:url(<cms:show ccs_hro_bg_img />); opacity: <cms:show ccs_hro_bg_img_opc />;" 
             role="img" 
             aria-label="<cms:show ccs_hro_bg_alt />" 
             data-rellax-speed="<cms:show ccs_hro_bg_scrl_spd />" 
			 data-rellax-percentage="0.5"
             data-parallax="data-parallax">
        </div>
    </cms:if>

    <cms:if ccs_hro_ovrly_clr_opt != 'transparent' && ccs_hro_ovrly_clr_opt != 'none' && ccs_hro_ovrly_clr_opt != ''>
        <div class="bg-holder hro-overlay"></div>
    </cms:if>
    
    <cms:embed 'pb_mods/hero/theme/hero_container_single.html' />

    <cms:if (k_user_access_level ge '7') && ("<cms:get_session 'inline_edit_on' />")> 
		<cms:ignore>--- Master Controls Wrapper ---</cms:ignore>
		<div class="position-absolute bottom-0 start-0 m-3 z-3 d-flex align-items-center gap-2">

			<cms:ignore>--- 1. Master Edit Button ---</cms:ignore>
			<cms:popup_edit '*' width='1270' height='720' link_text='<button class="btn btn-danger shadow-sm" type="button" aria-label="Master Edit Settings" title="All Hero Settings"><i class="fa-solid fa-gear"></i>Full Edit - All Settings</button>' />
		</div>
    </cms:if>
</section>
