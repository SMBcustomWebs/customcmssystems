    <div class="container">
        <div class="row align-items-center">
            
            <div class="col-sm-6 text-center text-sm-start ms-lg-n2">

                    <cms:set final_sc1_tgt='' scope="global" />
                    <cms:set final_sc1_icon="" scope="global" />

                <cms:set final_auth_tgt='' scope="global" />
                <cms:set final_auth_icon="" scope="global" />
                
                <cms:if ccs_ubr_shop_auth_lnk == 'custom'>

                    <cms:set final_auth_tgt='target="_blank"' scope="global" />
                    <cms:set final_auth_icon="<i class='fa-solid fa-arrow-up-right-from-square ms-1' style='font-size: 0.75em;' aria-hidden='true'></i>" scope="global" />

                    <cms:set final_auth_lnk="<cms:show ccs_ubr_shop_auth_lnk />" scope="global" />

                    <span class="visually-hidden">Profile</span>

        </div>

<!-- Cart Offcanvas Shell =======================-->
<!-- ============================================-->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel" style="width: 450px; max-width: 100vw;">
    <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">
            <i class="fas fa-shopping-cart me-2 text-primary"></i>Your Cart
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    
    <!-- The JavaScript will inject cart-modal.php exactly into this div -->
    <div class="offcanvas-body p-0" id="cart-modal-body">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>
