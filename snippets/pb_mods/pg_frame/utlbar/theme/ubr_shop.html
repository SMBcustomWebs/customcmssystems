<cms:set my_wishlist_count='0' scope='global' />
<cms:if k_logged_in>
    <!-- Use capture to silently trap the printed number into our variable -->
    <cms:capture into='my_wishlist_count' scope='global'>
        <cms:pages masterpage='wishlist.php' custom_field="wish_user_id==<cms:show k_user_id />" count_only='1' />
    </cms:capture>
</cms:if>
<section
    class="bg-<cms:show ccs_ubr_shop_bg_clr_opt /> py-0 text-<cms:show ccs_ubr_shop_txt_clr /> <cms:show ccs_ubr_shop_dspr /> <cms:if ccs_ubr_shop_stky>sticky-top top-0 start-0 z-3</cms:if>"
    aria-label="E-Commerce and Account Links">

    <cms:if ccs_gl_edt_ok>
        <div class="container-fluid pt-2">
            <cms:popup_edit 'ccs_ubr_shop_gen_grp|ccs_ubr_shop_init_msg|ccs_ubr_shop_gen_row|ccs_ubr_shop_bg_clr_opt|ccs_ubr_shop_txt_clr|ccs_ubr_shop_dspr|ccs_ubr_shop_stky_row|ccs_ubr_shop_stky_msg|ccs_ubr_shop_stky'
                link_text="<span class='bg-800 link-warning'>| [EDIT SHOP BAR] |</span>" />
            <cms:popup_edit 'ccs_ubr_shop_sc1_grp|ccs_ubr_shop_sc1_msg|ccs_ubr_shop_sc1_rpt'
                link_text="<span class='bg-800 link-warning'>| [EDIT LEFT LINKS] |</span>" />
            <cms:popup_edit 'ccs_ubr_shop_sc2_grp|ccs_ubr_shop_sc2_msg|ccs_ubr_shop_portal_row|ccs_ubr_shop_auth_txt|ccs_ubr_shop_auth_lnk|ccs_ubr_shop_auth_cst|ccs_ubr_shop_sys_icons|ccs_ubr_shop_icn_profile|ccs_ubr_shop_icn_wishlist|ccs_ubr_shop_icn_cart'
                link_text="<span class='bg-800 link-warning'>| [EDIT ICONS &amp; PORTAL] |</span>" />
        </div>
    </cms:if>

    <div class="container">
        <div class="row align-items-center">

            <div class="col-sm-6 text-center text-sm-start ms-lg-n2">
                <cms:show_repeatable 'ccs_ubr_shop_sc1_rpt'>

                    <cms:set final_sc1_tgt='' scope="global" />
                    <cms:set final_sc1_icon="" scope="global" />

                    <cms:if ccs_ubr_shop_sc1_lnk=='custom'>
                        <cms:set final_sc1_lnk="<cms:show ccs_ubr_shop_sc1_cst />" scope="global" />
                        <cms:set final_sc1_tgt='target="_blank"' scope="global" />
                        <cms:set
                            final_sc1_icon="<i class='fa-solid fa-arrow-up-right-from-square ms-1' style='font-size: 0.75em;' aria-hidden='true'></i>"
                            scope="global" />
                        <cms:else />
                        <cms:set final_sc1_lnk="<cms:show ccs_ubr_shop_sc1_lnk />" scope="global" />
                    </cms:if>

                    <a class="btn btn-link btn-sm px-2 link-<cms:show ccs_ubr_shop_txt_clr />"
                        href="<cms:show final_sc1_lnk />" <cms:show final_sc1_tgt />>
                    <cms:if ccs_ubr_shop_sc1_icn><span class="<cms:show ccs_ubr_shop_sc1_icn /> pe-1"
                            aria-hidden="true"></span></cms:if>
                    <cms:show ccs_ubr_shop_sc1_ttl />
                    <cms:show final_sc1_icon />
                    </a>
                </cms:show_repeatable>
            </div>

            <div class="col-sm-6 text-center text-sm-end pe-lg-2">

                <cms:set final_auth_tgt='' scope="global" />
                <cms:set final_auth_icon="" scope="global" />

                <cms:if ccs_ubr_shop_auth_lnk=='custom'>
                    <cms:set final_auth_lnk="<cms:show ccs_ubr_shop_auth_cst />" scope="global" />
                    <cms:set final_auth_tgt='target="_blank"' scope="global" />
                    <cms:set
                        final_auth_icon="<i class='fa-solid fa-arrow-up-right-from-square ms-1' style='font-size: 0.75em;' aria-hidden='true'></i>"
                        scope="global" />
                    <cms:else />
                    <cms:set final_auth_lnk="<cms:show ccs_ubr_shop_auth_lnk />" scope="global" />
                </cms:if>

                <a class="btn btn-link btn-sm px-2 link-<cms:show ccs_ubr_shop_txt_clr />"
                    href="<cms:show final_auth_lnk />" <cms:show final_auth_tgt />>
                <cms:show ccs_ubr_shop_auth_txt />
                <cms:show final_auth_icon />
                </a>

                <a class="btn btn-link btn-sm px-2 link-<cms:show ccs_ubr_shop_txt_clr />" href="#!">
                    <span class="fw-bolder fs-9 <cms:show ccs_ubr_shop_icn_profile />" aria-hidden="true"></span>
                    <span class="visually-hidden">Profile</span>
                </a>

                <!-- Wishlist Modal Trigger -->
                <a class="btn btn-link btn-sm px-2 link-<cms:show ccs_ubr_shop_txt_clr />" href="#wishlistOffcanvas"
                    data-bs-toggle="offcanvas" role="button" aria-controls="wishlistOffcanvas" title="Show Wishlist">
                    <span class="fw-bolder fs-9 <cms:show ccs_ubr_shop_icn_wishlist />" aria-hidden="true"></span>
                    <span class="visually-hidden">Wishlist</span>
                    <span id="wishlist-count-badge" class="d-inline-block ps-1">
                        <cms:show my_wishlist_count />
                    </span>
                </a>

                <!-- Cart Icon with Dynamic Count and Offcanvas Trigger -->
                <a class="btn btn-link btn-sm px-2 link-<cms:show ccs_ubr_shop_txt_clr /> pe-md-0" href="#cartOffcanvas"
                    data-bs-toggle="offcanvas" role="button" aria-controls="cartOffcanvas" title="Show Cart">
                    <span class="fw-bolder fs-9 <cms:show ccs_ubr_shop_icn_cart />" aria-hidden="true"></span>
                    <span class="visually-hidden">Cart</span>
                    <span class="d-inline-block ps-1 cart-qty-badge">
                        <cms:pp_count_items />
                    </span>
                </a>

            </div>

        </div>
    </div>
    <cms:if ccs_gl_edt_ok>
        <div class="position-absolute top-50 end-0 translate-middle-y me-3" style="z-index: 1060; line-height: 1;">
            <cms:pages masterpage='globals.php' limit='1'>
                <cms:popup_edit 'ccs_gl_site_nav_msg|ccs_gl_tpb_pb'
                    link_text="<button class='btn btn-sm btn-warning shadow-sm text-nowrap py-0 px-2' style='font-size: 11px; height: 24px; display: inline-flex; align-items: center;'><i class='fas fa-layer-group me-1' style='font-size: 10px;'></i>Swap Utility Bar</button>" />
            </cms:pages>
        </div>
    </cms:if>

</section>

<!-- ============================================-->
<!-- Cart Offcanvas Shell =======================-->
<!-- ============================================-->
<cms:embed 'e_modals/cart.html' />
<!-- ============================================-->
<!-- Wishlist Offcanvas Shell ===================-->
<!-- ============================================-->
<cms:embed 'e_modals/wishlist.html' />
