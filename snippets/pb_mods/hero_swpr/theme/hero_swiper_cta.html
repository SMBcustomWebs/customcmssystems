<cms:set cur_cta_rmv="<cms:get "ccs_hro_swpr_sl_<cms:show cur_slide_num />_cta_rmv" />" />

<cms:if ccs_hro_swpr_glbl_cta_rmv != '1' && cur_cta_rmv != '1'>
    
    <cms:set cur_cta_txt="<cms:get "ccs_hro_swpr_sl_<cms:show cur_slide_num />_cta_txt" />" />
    <cms:set cur_cta_lnk="<cms:get "ccs_hro_swpr_sl_<cms:show cur_slide_num />_cta_lnk" />" />
    
    <cms:if cur_cta_lnk == 'custom'>
        <cms:set cur_dest="<cms:get "ccs_hro_swpr_sl_<cms:show cur_slide_num />_cta_cst_lnk" />" />
    <cms:else />
        <cms:set cur_dest=cur_cta_lnk />
    </cms:if>

    <cms:if cur_cta_txt && cur_dest>
        <div class="d-flex w-100 justify-content-<cms:show act_cta_halg /> mt-4">
            <a class="btn <cms:show act_cta_st /> btn<cms:show act_cta_sz /> w-<cms:show act_cta_w /> <cms:if act_cta_clr == 'link'>btn-link text-<cms:show act_cta_lnk_clr /><cms:else />btn<cms:show act_cta_fill />-<cms:show act_cta_clr /></cms:if>" 
               href="<cms:show cur_dest />" 
               <cms:if cur_cta_lnk == 'custom'>target="_blank"</cms:if>>
               
               <cms:if act_cta_icon_pos == 'left' && act_cta_icon_fa>
                   <span class="btn-brand me-2"><i class="<cms:show act_cta_icon_fa />"></i></span>
               </cms:if>
               
               <cms:show cur_cta_txt />
               
               <cms:if act_cta_icon_pos == 'right' && act_cta_icon_fa>
                   <span class="btn-brand ms-2"><i class="<cms:show act_cta_icon_fa />"></i></span>
               </cms:if>
               
            </a>
        </div>
    </cms:if>

</cms:if>
