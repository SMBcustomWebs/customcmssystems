<cms:embed 'pb_mods/list_1/router/list1_cat_ins.inc' />

<section class="position-relative bg-<cms:show ccs_lst1_bg_clr_opt /> text-<cms:show ccs_lst1_hdg_txtbx_halg /> <cms:show ccs_lst1_pad_top /> <cms:show ccs_lst1_pad_bot />" style="<cms:show custom_bg_style />">
	
	<cms:embed 'pb_mods/list_1/inline/global_edit.txt' />
	
    <div class="container">
        
        <!-- HEADER BLOCK -->
        <div class="row justify-content-<cms:show ccs_lst1_hdg_txtbx_halg /> py-<cms:show ccs_lst1_hdg_txtbx_pd />">
            <div class="<cms:show txtbx_size />">
				
                <cms:embed 'pb_mods/list_1/inline/header_edit.txt' />
				
                <cms:if ccs_lst1_hdr_rmv_opt != '1'>
                    <!-- Main Headline -->
                    <cms:show main_hdg_open />
                        <cms:show ccs_lst1_hdg_txt_ln />
                    <cms:show main_hdg_close />
                    
                    <!-- Sub Headline -->
                    <cms:if ccs_lst1_sub_txt_ln != ''>
                        <cms:show sub_hdg_open />
                            <cms:show ccs_lst1_sub_txt_ln />
                        <cms:show sub_hdg_close />
                    </cms:if>

                    <!-- Dividing Line -->
                    <cms:if ccs_lst1_hdg_hr != 'none'>
                        <hr class="<cms:show hr_classes />" />
                    </cms:if>
                </cms:if>
                
            </div>
        </div>
        <!-- ======================================================= -->
        <!-- DYNAMIC GRID LOGIC (FOLDERS VS PAGES)                   -->
        <!-- ======================================================= -->
        
        <!-- SCENARIO A: DISPLAYING FOLDERS ONLY (No Filter) -->
        <cms:if ccs_lst1_content_typ='folders'>
            <div class="row text-start" data-isotope='{"layoutMode":"packery"}'>
                <cms:folders masterpage=source_master childof=target_folder hierarchical='1' depth='1'>
                    
                    <cms:if k_folder_image>
                        <cms:set bg_img=k_folder_image scope='global' />
                    <cms:else />
                        <cms:set bg_img="<cms:show k_admin_link />uploads/image/no-img_f.jpg" scope='global' />
                    </cms:if>

                    <div class="col-12 col-md-6 <cms:show ccs_lst1_col_cnt /> isotope-item">
						<a class="text-decoration-none" href="<cms:show k_folder_link />">
							<div class="hoverbox mb-4 position-relative" style="z-index: 1;">
								<div class="bg-holder overlay <cms:show ccs_lst1_img_rnd />" style="background-image:url('<cms:show bg_img />');"></div>

								<!-- Pushes the banner to the bottom -->
								<div class="pt-11">

									<!-- EDGE-TO-EDGE TEXT BANNER -->
									<div class="px-4 pt-3 pb-3 <cms:show ccs_lst1_txt_bg_opt /> <cms:show ccs_lst1_txt_bg_opc /> text-<cms:show ccs_lst1_itm_txt_halg />">

										<h5 class="mb-2 <cms:show item_hdg_classes />">
											<cms:show k_folder_title /> 
										</h5>

										<style>
											.force-inherit-color p { 
												color: inherit !important; 
												margin-bottom: 0; 
											}
										</style>

										<div class="<cms:show item_sub_classes /> force-inherit-color">
											<cms:excerpt count='100' truncate_chars='1' trail="...(more)">
												<cms:show k_folder_desc />
											</cms:excerpt>
										</div>

									</div>
								</div>

							</div>
						</a>
					</div>
                </cms:folders>
            </div>

        <!-- SCENARIO B: DISPLAYING PAGES (With Filter) -->
        <cms:else />
            
            <div class="row justify-content-center my-6">
                <div class="col-7 col-sm-4 col-md-3">
                    <select class="form-select form-select-lg text-1100" id="filter-<cms:show k_count />" name="filter">
                        <option class="isotope-nav active" value="*" data-filter="*" selected="selected"> 
							All 
							<cms:if target_folder>
								<cms:folders masterpage=source_master>
									<cms:if k_folder_name=target_folder>
										<cms:show k_folder_title /> 
									</cms:if>
								</cms:folders>
							</cms:if>
							<cms:if ccs_lst1_content_typ='pages'>Pages<cms:else />Categories</cms:if>
						</option>
                        <cms:folders masterpage=source_master childof=target_folder hierarchical='1' depth='1'>
                            <option class="isotope-nav" value=".<cms:show k_folder_name />" data-filter=".<cms:show k_folder_name />"><cms:show k_folder_title /></option>
                        </cms:folders>
                    </select>
                </div>
            </div>

            <div class="row text-start" id="grid-<cms:show k_count />" data-isotope='{"layoutMode":"packery"}'>
                <cms:pages masterpage=source_master folder=target_folder include_subfolders='1'>
                    
                    <cms:no_results>
                        <div class="col-12 text-center py-5">
                            <p class="lead text-muted">No items found in this category.</p>
                        </div>
                    </cms:no_results>

                    <!-- 1. Set the default fallback image first -->
					<cms:set bg_img="<cms:show k_admin_link />uploads/image/no-img_f.jpg" scope='global' />

					<!-- 2. Check for the About image -->
					<cms:if img>
						<cms:set bg_img=img scope='global' />
					</cms:if>

					<!-- 3. Check for the Product and Service image  -->
					<cms:if itm_img_mn>
						<cms:set bg_img=itm_img_mn scope='global' />
					</cms:if>


                    <div class="col-12 col-md-6 <cms:show ccs_lst1_col_cnt /> isotope-item <cms:show k_page_foldername />">
						<a class="text-decoration-none" href="<cms:show k_page_link />">
							<div class="hoverbox mb-4 position-relative" style="z-index: 1;">
								<div class="bg-holder overlay <cms:show ccs_lst1_img_rnd />" style="background-image:url('<cms:show bg_img />');"></div>

								<!-- Pushes the banner to the bottom -->
								<div class="pt-<cms:show ccs_lst1_txt_bg_opt />">

									<!-- EDGE-TO-EDGE TEXT BANNER -->
									<div class="px-4 pt-3 pb-3 <cms:show ccs_lst1_txt_bg_opt /> <cms:show ccs_lst1_txt_bg_opc /> text-<cms:show ccs_lst1_itm_txt_halg />">

										<h5 class="mb-1 <cms:show item_hdg_classes />">
											<cms:show k_page_title />
										</h5>

										<p class="mb-0 text-<cms:show item_sub_classes />">
											<cms:show k_page_foldertitle />
										</p>

									</div>
								</div>

							</div>
						</a>
					</div>
                </cms:pages>
            </div>
        </cms:if>

    </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Wait a brief moment to let your theme initialize the grids first
    setTimeout(function() {
        var selectEl = document.getElementById('filter-<cms:show k_count />');
        var gridEl = document.getElementById('grid-<cms:show k_count />');
        
        if (selectEl && gridEl) {
            selectEl.addEventListener('change', function() {
                var filterValue = this.value;
                
                // Try modern Vanilla JS Isotope first
                if (typeof Isotope !== 'undefined') {
                    var iso = Isotope.data(gridEl);
                    if (iso) {
                        iso.arrange({ filter: filterValue });
                        return;
                    }
                }
                
                // Fallback if your theme relies on jQuery
                if (typeof jQuery !== 'undefined' && jQuery.fn.isotope) {
                    jQuery(gridEl).isotope({ filter: filterValue });
                }
            });
        }
    }, 400); 
});
</script>
