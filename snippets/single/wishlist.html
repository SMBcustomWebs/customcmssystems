<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-12">
            
                <cms:if k_logged_in && ccs_auth_uid>
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                        <h3 class="mb-0 fw-bold">Your Saved Items</h3>
                        <a href="<cms:link 'cart.php' />" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-shopping-cart me-1" aria-hidden="true"></i>View Cart
                        </a>
                    </div>

                    <div class="wishlist-container">
                        <!-- 1. Outer Loop: Find records in wishlist.php for this specific user -->
                        <cms:pages masterpage='wishlist.php' custom_field="wish_user_id==<cms:show ccs_auth_uid />">

                            <!-- Save outer variables before entering the inner loop so Couch doesn't forget them -->
                            <cms:set my_saved_variants = wish_variants />
                            <cms:set my_saved_variants_display = wish_variants_display />
                            <cms:set my_wishlist_entry_id = k_page_id />
                            <cms:set my_saved_masterpage = wish_masterpage />

                            <!-- 2. Inner Loop: fetch the live item using the template it was
                                 SAVED FROM. This was hardcoded to product.php, so a saved
                                 service matched the outer loop (and the badge) but resolved
                                 to nothing here - the list looked empty while the count said 1. -->
                            <!-- GUARD: an empty masterpage is NOT harmless. tags.php:294
                                 defaults cms:pages to the CURRENT template, so a blank
                                 wish_masterpage would silently query wishlist.php for a
                                 product id, match nothing, and render an empty list while
                                 the badge still counts the row. Fail visibly instead.
                                 Carries wishlist-item-row + the row id so the JS can
                                 remove it - the normal Remove button lives inside the
                                 lookup loop, which cannot run for a broken row. -->
                            <cms:if my_saved_masterpage eq ''>
                                <div class="card mb-3 p-3 border border-warning bg-light wishlist-item-row" id="wishlist-item-<cms:show my_wishlist_entry_id />">
                                    <p class="mb-1 fw-bold">This saved item is no longer available.</p>
                                    <cms:if k_user_access_level ge '7'>
                                        <p class="small text-muted mb-1">Entry <cms:show my_wishlist_entry_id /> has no wish_masterpage.</p>
                                    </cms:if>
                                    <div>
                                        <button type="button" class="btn btn-link text-danger p-0 text-decoration-none shadow-none remove-wishlist-btn" data-entry-id="<cms:show my_wishlist_entry_id />">
                                            <i class="fas fa-trash-alt"></i> Remove
                                        </button>
                                    </div>
                                </div>
                            </cms:if>

                            <cms:pages masterpage=my_saved_masterpage id=wish_product_id limit='1'>
                                
                                <!-- JS HOOKS ADDED HERE: class="wishlist-item-row" and id="..." -->
                                <div class="card mb-3 p-3 border shadow-sm wishlist-item-row" id="wishlist-item-<cms:show my_wishlist_entry_id />">
                                    <div class="row align-items-center">
                                        <cms:if itm_img_mn>
                                            <div class="col-3 col-md-2">
                                                <a href="<cms:show k_page_link />" class="d-block" tabindex="-1" aria-hidden="true">
                                                    <img src="<cms:show itm_img_mn />" alt="" class="img-fluid rounded border">
                                                </a>
                                            </div>
                                        </cms:if>
                                        <div class="<cms:if itm_img_mn>col-9 col-md-6<cms:else />col-md-8</cms:if>">
                                            <h5 class="mb-1">
                                                <a href="<cms:show k_page_link />" class="text-decoration-none text-dark"><cms:show k_page_title /></a>
                                            </h5>
                                            
                                            <!-- Readable copy. The raw string (my_saved_variants)
                                                 is machine-parseable and deliberately NOT shown. -->
                                            <cms:if my_saved_variants_display>
                                                <p class="text-muted small mb-2">
                                                    <cms:show my_saved_variants_display />
                                                </p>
                                            </cms:if>
                                            
                                            <!-- 3. Live Stock Checking Logic -->
                                            <cms:if track_inventory>
                                                <cms:if in_stock le '0'>
                                                    <span class="badge bg-danger"><i class="fas fa-times-circle me-1"></i> Out of Stock</span>
                                                <cms:else />
                                                    <span class="badge bg-success"><i class="fas fa-check-circle me-1"></i> In Stock</span>
                                                </cms:if>
                                            </cms:if>
                                        </div>
                                        
                                        <!-- 4. BUTTONS -->
                                        <div class="col-md-4 text-md-end mt-3 mt-md-0 d-flex justify-content-md-end align-items-center">
                                            
                                            <!-- Remove Button -->
                                            <button type="button" class="btn btn-link text-danger p-0 text-decoration-none shadow-none remove-wishlist-btn me-4" data-entry-id="<cms:show my_wishlist_entry_id />">
                                                <i class="fas fa-trash-alt"></i> Remove
                                            </button>
                
                                            <!-- Move to Cart Button or Out of Stock Badge -->
                                            <cms:if track_inventory ne '1' || in_stock gt '0'>
                                                <button type="button" class="btn btn-outline-success move-to-cart-btn"
                                                        data-product-link="<cms:show k_page_link />"
                                                        data-variants="<cms:show my_saved_variants />"
                                                        data-entry-id="<cms:show my_wishlist_entry_id />">
                                                    <i class="fas fa-shopping-cart"></i> Move to Cart
                                                </button>
                                            <cms:else />
                                                <span class="text-danger small fw-bold">
                                                    <i class="fas fa-exclamation-circle me-1"></i> Temp Out of Stock
                                                </span>
                                            </cms:if>
                                            
                                        </div>
                                    </div>
                                </div>
                
                            </cms:pages>
                
                            <!-- If the user has no saved items, show this message -->
                            <cms:no_results>
                                <!-- JS HOOK ADDED HERE: class="empty-wishlist-msg" -->
                                <div class="alert alert-info py-4 text-center shadow-sm empty-wishlist-msg">
                                    <i class="far fa-heart fa-2x mb-2 text-muted"></i>
                                    <h5 class="mb-0">You haven't saved any items yet.</h5>
                                </div>
                            </cms:no_results>
                
                        </cms:pages>
                    </div>
                <cms:else />
                    <div class="alert alert-warning p-4 text-center shadow-sm mt-4">
                        <i class="fas fa-lock fa-2x mb-3 text-muted"></i>
                        <h5 class="mb-0">Please <a href="<cms:login_link />" class="text-decoration-none">log in</a> to view your saved items.</h5>
                    </div>
                </cms:if>

            </div>
        </div>
    </div>
</section>
