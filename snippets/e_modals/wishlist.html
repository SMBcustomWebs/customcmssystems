<cms:ignore>
    Offcanvas SHELL only. The list itself lives in wishlist_body.html
    so that wishlist-modal.php can re-render exactly the same markup
    on demand, letting refreshWishlistModal() update the panel without
    a page reload. Same split as e_modals/cart.html + cart-modal.php.
</cms:ignore>
<div class="offcanvas offcanvas-end" tabindex="-1" id="wishlistOffcanvas" aria-labelledby="wishlistOffcanvasLabel" style="width: 450px; max-width: 100vw;">
    <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold" id="wishlistOffcanvasLabel">
            <i class="far fa-heart me-2 text-primary"></i>Saved for Later
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body p-0" id="wishlist-modal-body">
        <cms:embed 'e_modals/wishlist_body.html' />
    </div>
</div>
