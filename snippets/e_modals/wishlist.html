<div class="offcanvas offcanvas-end" tabindex="-1" id="wishlistOffcanvas" aria-labelledby="wishlistOffcanvasLabel" style="width: 450px; max-width: 100vw;">
    <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold" id="wishlistOffcanvasLabel">
            <i class="far fa-heart me-2 text-primary"></i>Saved for Later
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    
    <div class="offcanvas-body p-0" id="wishlist-modal-body">
        <cms:if k_logged_in>
            <div class="d-flex flex-column h-100 m-0">
                <div class="flex-grow-1 overflow-auto p-3">
                    
                    <cms:pages masterpage='wishlist.php' custom_field="wish_user_id==<cms:show k_user_id />">
                        <cms:set my_saved_variants = wish_variants />
                        <cms:set my_wishlist_entry_id = k_page_id />

                        <cms:pages masterpage='product.php' id=wish_product_id limit='1'>
                            <!-- Notice the dynamic ID added to the row so JS can hide it easily! -->
                            <div class="row border-bottom py-3 mx-0 wishlist-item-row" id="wishlist-item-<cms:show my_wishlist_entry_id />">
                                <div class="col-12 px-2">
                                    <a href="<cms:show k_page_link />" class="text-decoration-none">
                                        <p class="mb-1 fw-bold"><cms:show k_page_title /></p>
                                    </a>
                                    
                                    <div class="mb-0 text-muted small">
                                        <em><cms:show my_saved_variants /></em>
                                    </div>
                                    
                                    <div class="mt-3 d-flex justify-content-between align-items-center">
                                        
                                        <!-- Simple Remove Button -->
                                        <button type="button" class="btn btn-link text-danger p-0 text-decoration-none shadow-none remove-wishlist-btn" data-entry-id="<cms:show my_wishlist_entry_id />" style="font-size: 0.85rem;">
                                            <i class="fas fa-trash-alt"></i> Remove
                                        </button>

                                        <!-- Move to Cart Button -->
                                        <!-- Move to Cart Button or Out of Stock Badge -->
										<cms:if track_inventory ne '1' || in_stock gt '0'>
											<button type="button" class="btn btn-sm btn-outline-success move-to-cart-btn"
													data-product-link="<cms:show k_page_link />"
													data-variants="<cms:show my_saved_variants />"
													data-entry-id="<cms:show my_wishlist_entry_id />">
												<i class="fas fa-shopping-cart"></i> Move to Cart
											</button>
										<cms:else />
											<span class="text-danger small fw-bold" style="font-size: 0.85rem;">
												<i class="fas fa-exclamation-circle"></i> Temp Out of Stock
											</span>
										</cms:if>
                                    </div>
                                </div>
                            </div>
                        </cms:pages>

                        <cms:no_results>
                            <div class="text-center text-muted mt-5 py-4 empty-wishlist-msg">
                                <i class="far fa-heart fa-3x mb-3 opacity-50"></i>
                                <h5>Your wishlist is empty.</h5>
                            </div>
                        </cms:no_results>
                    </cms:pages>
                    
                </div>
            </div>
        <cms:else />
            <div class="p-4 mt-5 text-center">
                <i class="fas fa-lock fa-3x mb-3 text-muted"></i>
                <h5>Please <a href="<cms:login_link />">log in</a> to view saved items.</h5>
            </div>
        </cms:if>
    </div>
</div>
